name: cue
description: A free, private, offline scene partner for actors.
publish_to: none
version: 1.1.0+6
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.40
  file_picker: ^10.3.3
  archive: ^4.0.7
  xml: ^6.6.1
  pdfrx: ^2.2.15
  google_mlkit_text_recognition: ^0.15.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  audio_session: ^0.2.2
  sherpa_onnx: 1.13.8
  ffi: ^2.1.4
  crypto: ^3.0.6
  cue_native:
    path: packages/cue_native
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sample.fountain
    - assets/models.json
    - assets/import-test.pdf
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
